org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Уменьшаем логирование при сборке
org.gradle.logging.level=quiet
android.suppressUnsupportedCompileSdkWarning=true
android.builder.verbose=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Оптимизированное удаление неиспользуемых ресурсов (05.10.2026).
#
# Google Play в рекомендациях пишет, что оно у нас не включено. Работает с
# плагина Android 8.12, у нас 8.13. Начиная с девятой ветки флаг не нужен:
# там это включается само вместе с isShrinkResources.
#
# Полный режим R8 отдельного флага не требует: он включён по умолчанию с
# восьмой ветки, и строки android.enableR8.fullMode=false здесь нет намеренно.
android.r8.optimizedResourceShrinking=true
